# Publica el sitio estático en GitHub Pages al actualizar main.
name: Publicar frontend NOX en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar sitio
        id: despliegue
        uses: actions/deploy-pages@v4
